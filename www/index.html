<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FFCF00">
<title>BrickScan</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
/* VOICE: freundlich, griffig, wie ein Sortierkasten
   IDEA: Liste = Sammelkasten, Kopf = gelbe Preis-Banderole
   PICTURE: die Teilebilder selbst
   COLOUR/TYPE: LEGO-Gelb, Rot als Aktion, Rubik
   LAYOUT: Kopf mit Summe, 2 Tabs, Liste, Scan-Leiste unten */
:root{color-scheme:light dark;
  --y:#FFCF00;--y2:#F2B700;--r:#D01012;--r2:#A80C0E;
  --bg:light-dark(#ffffff,#121212);--card:light-dark(#f4f4f2,#1d1d1d);--line:light-dark(#e4e2dc,#2c2c2c);
  --ink:light-dark(#1a1a1a,#f2f2f2);--mut:light-dark(#6b6b6b,#a3a3a3);--ok:#1f8a3b;--warn:#b35c00}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 Rubik,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
body{overflow-x:clip;padding-bottom:calc(96px + env(safe-area-inset-bottom))}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--r);outline-offset:2px}
.top{position:sticky;top:0;z-index:5;background:var(--y);color:#1a1a1a;padding:calc(10px + env(safe-area-inset-top)) 16px 0}
.row{display:flex;align-items:center;gap:10px}
.brand{font-weight:800;font-size:15px;letter-spacing:.2px;display:flex;align-items:center;gap:8px}
.stud{width:22px;height:22px}
.icon-btn{margin-left:auto;width:44px;height:44px;border:0;border-radius:12px;background:rgba(0,0,0,.08);display:grid;place-items:center}
.icon-btn svg{width:22px;height:22px}
.total{padding:6px 0 12px}
.total small{display:block;font-size:13px;font-weight:500;opacity:.75}
.total b{display:block;font-size:clamp(34px,10vw,48px);font-weight:800;line-height:1.05;white-space:nowrap}
.total span{font-size:14px;opacity:.8}
.tabs{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.tab{border:0;background:transparent;padding:10px 6px 12px;border-radius:12px 12px 0 0;font-weight:700;font-size:16px;color:#1a1a1a;opacity:.7}
.tab em{display:block;font-style:normal;font-weight:500;font-size:13px;white-space:nowrap}
.tab[aria-selected=true]{background:var(--bg);color:var(--ink);opacity:1}
.bar{display:flex;gap:8px;align-items:center;padding:12px 16px 4px;flex-wrap:wrap}
.bar select,.chip{height:40px;border-radius:10px;border:1px solid var(--line);background:var(--card);padding:0 12px;font-size:15px}
.chip{display:inline-flex;align-items:center;gap:6px;margin-left:auto}
.note{margin:10px 16px 0;padding:10px 12px;border-radius:12px;background:light-dark(#fff4d1,#2b2410);font-size:14px;display:flex;gap:10px;align-items:center}
.note button{margin-left:auto;border:0;background:var(--ink);color:var(--bg);border-radius:9px;padding:8px 12px;font-weight:600;flex:none}
.list{list-style:none;margin:0;padding:8px 16px}
.item{display:grid;grid-template-columns:72px minmax(0,1fr) auto;gap:12px;align-items:center;padding:10px;border-radius:16px;background:var(--card);margin-bottom:8px;border:0;width:100%;text-align:left}
.thumb{width:72px;height:72px;border-radius:12px;background:#fff;display:grid;place-items:center;overflow:hidden}
.thumb img{max-width:100%;max-height:100%;object-fit:contain}
.nm{font-weight:600;font-size:15px;line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.meta{font-size:13px;color:var(--mut);margin-top:3px;display:flex;flex-wrap:wrap;gap:4px 8px}
.sw{display:inline-block;width:11px;height:11px;border-radius:3px;border:1px solid rgba(0,0,0,.25);vertical-align:-1px;margin-right:3px}
.pr{text-align:right;white-space:nowrap}
.pr b{display:block;font-size:17px}
.pr small{display:block;font-size:12px;color:var(--mut)}
.pr .err{color:var(--warn)}
.empty{text-align:center;padding:48px 24px;color:var(--mut)}
.empty svg{width:120px;height:auto;margin-bottom:12px}
.empty p{margin:4px 0}
.dock{position:fixed;left:0;right:0;bottom:0;z-index:6;padding:12px 16px calc(12px + env(safe-area-inset-bottom));background:linear-gradient(to top,var(--bg) 70%,transparent);display:flex;gap:10px}
.scan{flex:1;height:58px;border:0;border-radius:18px;background:var(--r);color:#fff;font-weight:700;font-size:18px;display:flex;align-items:center;justify-content:center;gap:10px;box-shadow:0 6px 0 var(--r2)}
.scan:active{transform:translateY(3px);box-shadow:0 3px 0 var(--r2)}
.scan svg{width:24px;height:24px}
.gal{width:58px;height:58px;border-radius:18px;border:2px solid var(--line);background:var(--card);display:grid;place-items:center}
.gal svg{width:24px;height:24px}
.veil{position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.45);display:none;align-items:flex-end;justify-content:center}
.veil.open{display:flex}
.sheet{background:var(--bg);width:100%;max-width:640px;max-height:92vh;overflow:auto;border-radius:22px 22px 0 0;padding:8px 16px calc(18px + env(safe-area-inset-bottom));animation:up .22s ease-out}
@keyframes up{from{transform:translateY(40px);opacity:.4}}
@media (prefers-reduced-motion:reduce){.sheet{animation:none}}
.grab{width:44px;height:5px;border-radius:3px;background:var(--line);margin:4px auto 10px}
.sheet h2{font-size:22px;margin:4px 0 12px;line-height:1.15}
.sheet h3{font-size:15px;margin:16px 0 8px;color:var(--mut);font-weight:600}
.photo{display:flex;gap:12px;align-items:center;margin-bottom:6px}
.photo img{width:84px;height:84px;object-fit:cover;border-radius:12px;background:var(--card)}
.cands{display:grid;gap:8px}
.cand{display:grid;grid-template-columns:64px minmax(0,1fr) auto;gap:12px;align-items:center;padding:8px;border-radius:14px;border:2px solid var(--line);background:var(--card);text-align:left;width:100%}
.cand[aria-checked=true]{border-color:var(--r);background:light-dark(#fff1f1,#2a1415)}
.cand .thumb{width:64px;height:64px}
.score{font-size:13px;font-weight:700;white-space:nowrap}
.meter{height:5px;border-radius:3px;background:var(--line);margin-top:6px;overflow:hidden}
.meter i{display:block;height:100%;background:var(--ok)}
.seg{display:inline-grid;grid-auto-flow:column;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.seg button{border:0;background:var(--card);padding:0 16px;height:44px;font-weight:600}
.seg button[aria-pressed=true]{background:var(--ink);color:var(--bg)}
.step{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.step button{width:44px;height:44px;border:0;background:var(--card);font-size:22px;font-weight:600}
.step input{width:56px;height:44px;border:0;text-align:center;background:var(--bg);font-size:16px}
.opts{display:flex;flex-wrap:wrap;gap:14px 18px;align-items:flex-end}
.opts label{display:grid;gap:6px;font-size:13px;color:var(--mut);font-weight:600}
.field{display:grid;gap:6px;margin-bottom:12px;font-size:13px;color:var(--mut);font-weight:600}
.field input,.field select,.opts select{height:46px;border-radius:12px;border:1px solid var(--line);background:var(--card);padding:0 12px;font-size:16px;color:var(--ink);font-weight:400;width:100%}
.opts select{min-width:200px}
.acts{display:grid;gap:8px;margin-top:18px}
.btn{height:52px;border-radius:14px;border:0;font-weight:700;font-size:16px;background:var(--card);border:1px solid var(--line)}
.btn.pri{background:var(--r);color:#fff;border:0}
.btn.dark{background:var(--ink);color:var(--bg);border:0}
.btn.del{color:var(--r)}
.btn:disabled{opacity:.5}
.link{background:none;border:0;color:var(--r);font-weight:600;padding:10px 0;text-decoration:underline}
a{color:var(--r)}
.spin{width:44px;height:44px;border-radius:50%;border:5px solid var(--line);border-top-color:var(--r);animation:sp 0.9s linear infinite;margin:24px auto 10px}
@keyframes sp{to{transform:rotate(360deg)}}
.center{text-align:center;color:var(--mut)}
.help{font-size:14px;color:var(--mut);background:var(--card);border-radius:12px;padding:12px 14px;margin:6px 0 14px}
.help ol{margin:6px 0 0;padding-left:20px}.help li{margin:3px 0}
.big-price{font-size:30px;font-weight:800}
.toast{position:fixed;left:16px;right:16px;bottom:calc(92px + env(safe-area-inset-bottom));z-index:30;background:var(--ink);color:var(--bg);border-radius:14px;padding:12px 14px;display:none;align-items:center;gap:12px;max-width:600px;margin:auto;font-size:15px}
.toast.show{display:flex}
.toast button{margin-left:auto;border:0;background:var(--y);color:#1a1a1a;border-radius:9px;padding:8px 12px;font-weight:700;flex:none}
.ok{color:var(--ok)}.bad{color:var(--r)}
.warnchip{background:light-dark(#ffe1c2,#3a2410);color:var(--warn);font-weight:700;border-radius:6px;padding:1px 7px}
.chip[aria-pressed=true]{background:var(--y);border-color:var(--y2);color:#1a1a1a;font-weight:700}
.finder{position:fixed;inset:0;z-index:45;background:var(--bg);display:flex;flex-direction:column;overflow:auto}
.finder .fhead{position:sticky;top:0;background:var(--y);color:#1a1a1a;padding:calc(12px + env(safe-area-inset-top)) 16px 12px;display:flex;align-items:center;gap:10px;font-weight:800;font-size:17px}
.finder .fbody{padding:12px 16px calc(20px + env(safe-area-inset-bottom))}
.fprog{height:8px;border-radius:5px;background:var(--line);overflow:hidden;margin:10px 0}
.fprog i{display:block;height:100%;background:var(--r);transition:width .2s}
.setrow{display:grid;grid-template-columns:64px minmax(0,1fr) auto;gap:12px;align-items:center;padding:10px;border-radius:14px;background:var(--card);margin-bottom:8px;text-decoration:none;color:inherit}
.setrow .thumb{width:64px;height:64px;border-radius:10px}
.setrow .pct{text-align:right;font-weight:800;font-size:18px;white-space:nowrap}
.setrow .bar2{height:6px;border-radius:3px;background:var(--line);margin-top:6px;overflow:hidden}
.setrow .bar2 i{display:block;height:100%}
.fnote{font-size:14px;color:var(--mut);background:var(--card);border-radius:12px;padding:12px 14px;margin:4px 0 14px}
.mgrid{display:grid;gap:8px;margin:6px 0 4px}
.mrow{display:grid;grid-template-columns:56px minmax(0,1fr) 28px;gap:10px;align-items:center;padding:8px;border-radius:12px;background:var(--card)}
.mrow.off{opacity:.45}
.mthumb{width:56px;height:56px;border-radius:9px;background:#fff;object-fit:contain}
.mrow select,.mrow .mc,.mrow .mq{height:38px;border-radius:9px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font-size:14px;padding:0 8px;width:100%}
.mrow .mline{display:grid;grid-template-columns:1fr 64px;gap:6px;margin-top:6px}
.mrow .minc{width:24px;height:24px}
.cam{position:fixed;inset:0;z-index:50;background:#000;color:#fff;display:flex;flex-direction:column}
.cam video{flex:1;min-height:0;width:100%;object-fit:cover;background:#000}
.cam .guide{position:absolute;left:50%;top:45%;width:min(70vw,62vh);aspect-ratio:1;transform:translate(-50%,-50%);border:3px solid rgba(255,207,0,.9);border-radius:24px;box-shadow:0 0 0 100vmax rgba(0,0,0,.28);pointer-events:none}
.cam .ctop{position:absolute;top:0;left:0;right:0;display:flex;gap:10px;align-items:center;padding:calc(12px + env(safe-area-inset-top)) 16px 12px;background:linear-gradient(rgba(0,0,0,.55),transparent);font-weight:600}
.cam .ctop .icon-btn{background:rgba(255,255,255,.18);color:#fff;margin-left:0}
.cam .ctop .sp{flex:1}
.cam .cbar{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:16px 24px calc(20px + env(safe-area-inset-bottom));background:#000}
.cam .shut{width:76px;height:76px;border-radius:50%;border:5px solid #fff;background:var(--r);box-shadow:inset 0 0 0 4px #000}
.cam .shut:active{transform:scale(.94)}
.cam .side{width:52px;height:52px;border-radius:14px;border:0;background:rgba(255,255,255,.16);color:#fff;display:grid;place-items:center}
.cam .side svg{width:24px;height:24px}
.cam .side[aria-pressed=true]{background:var(--y);color:#1a1a1a}
.cam .cmsg{position:absolute;left:16px;right:16px;top:45%;transform:translateY(-50%);text-align:center;font-size:16px}
.reader{position:fixed;inset:0;z-index:40;background:var(--bg);display:flex;flex-direction:column;overflow:auto}
.win{flex:none;margin-top:env(safe-area-inset-top);background:var(--card);display:grid;place-items:center;text-align:center;padding:16px;color:var(--mut);font-size:14px;border-bottom:3px solid var(--y)}
.win a{font-weight:700}
.rpanel{padding:10px 16px calc(16px + env(safe-area-inset-bottom))}
.rhead{display:grid;grid-template-columns:48px minmax(0,1fr) 44px;gap:10px;align-items:center}
.rhead .thumb{width:48px;height:48px;border-radius:10px}
.rhint{font-size:14px;margin:8px 0;color:var(--mut)}
.rhint b{color:var(--ink)}
.rin{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px}
.rin input{height:52px;border-radius:14px;border:2px solid var(--r);background:var(--card);padding:0 14px;font-size:22px;font-weight:700;color:var(--ink);width:100%}
.rin .btn{padding:0 18px}
.rfoot{display:flex;gap:16px;flex-wrap:wrap;font-size:14px;margin-top:4px}
.rfoot .link{font-size:14px}
</style>
</head>
<body>
<header class="top">
  <div class="row">
    <div class="brand"><svg class="stud" viewBox="0 0 24 24"><rect x="1" y="7" width="22" height="15" rx="2.5" fill="#D01012"/><rect x="4" y="2.5" width="6" height="5.5" rx="1.2" fill="#D01012"/><rect x="14" y="2.5" width="6" height="5.5" rx="1.2" fill="#D01012"/><rect x="1" y="7" width="22" height="3" fill="#A80C0E"/></svg>BrickScan</div>
    <button class="icon-btn" id="btnSettings" aria-label="Einstellungen"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="3.2"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></button>
  </div>
  <div class="total"><small id="totalLabel">Minifigs gesamt</small><b id="total">0,00 €</b><span id="totalSub">Noch nichts gescannt</span></div>
  <div class="tabs" role="tablist">
    <button class="tab" role="tab" id="tab-fig" aria-selected="true">Minifigs<em id="sum-fig">0 · 0,00 €</em></button>
    <button class="tab" role="tab" id="tab-part" aria-selected="false">Teile<em id="sum-part">0 · 0,00 €</em></button>
  </div>
</header>

<div id="setupNote" class="note" hidden><span>Ohne BrickLink-Schlüssel liest du den Preis nach dem Scan selbst ab. Mit Schlüssel kommt er automatisch.</span><button id="btnSetup">Schlüssel</button></div>

<div class="bar">
  <select id="sort" aria-label="Sortierung">
    <option value="new">Neueste zuerst</option>
    <option value="val">Höchster Wert</option>
    <option value="name">Name A–Z</option>
  </select>
  <button class="chip" id="btnBulk" aria-pressed="false"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"><path d="M13 2 4 14h7l-1 8 9-12h-7z"/></svg><span>Schnell-Scan</span></button>
  <button class="chip" id="btnMulti" aria-pressed="false"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg><span>Multi-Foto</span></button>
  <button class="chip" id="btnFinder" hidden><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"><path d="M3 8.5 12 4l9 4.5-9 4.5z"/><path d="M3 8.5v7L12 20l9-4.5v-7"/><path d="M12 13v7"/></svg><span>Sets finden</span></button>
  <button class="chip" id="btnRefresh"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M21 12a9 9 0 1 1-3-6.7L21 8"/><path d="M21 3v5h-5"/></svg><span>Preise neu</span></button>
</div>

<ul class="list" id="list"></ul>

<div class="dock">
  <button class="scan" id="btnScan"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"><path d="M3 8.5A2.5 2.5 0 0 1 5.5 6h2l1.6-2.2h5.8L16.5 6h2A2.5 2.5 0 0 1 21 8.5v9a2.5 2.5 0 0 1-2.5 2.5h-13A2.5 2.5 0 0 1 3 17.5z"/><circle cx="12" cy="13" r="3.8"/></svg><span id="scanLabel">Minifig scannen</span></button>
  <button class="gal" id="btnGallery" aria-label="Foto aus Galerie"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2.5"/><circle cx="9" cy="10" r="2"/><path d="m21 16-5-5-9 9"/></svg></button>
</div>
<input type="file" id="fileCam" accept="image/*" capture="environment" hidden>
<input type="file" id="fileGal" accept="image/*" hidden>
<input type="file" id="fileMulti" accept="image/*" capture="environment" hidden>

<div class="veil" id="veil"><div class="sheet" id="sheet" role="dialog" aria-modal="true"></div></div>
<div class="finder" id="finder" hidden></div>
<div class="cam" id="cam" hidden>
  <video id="camVideo" autoplay playsinline muted></video>
  <div class="guide"></div>
  <div class="cmsg" id="camMsg"></div>
  <div class="ctop"><button class="icon-btn" id="camClose" aria-label="Schließen"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg></button><span id="camTitle">Minifig scannen</span><span class="sp"></span><button class="icon-btn" id="camTorch" aria-label="Licht" aria-pressed="false" hidden><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M13 2 4 14h7l-1 8 9-12h-7z"/></svg></button></div>
  <div class="cbar"><button class="side" id="camGal" aria-label="Foto aus Galerie"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2.5"/><circle cx="9" cy="10" r="2"/><path d="m21 16-5-5-9 9"/></svg></button><button class="shut" id="camShut" aria-label="Foto aufnehmen"></button><span></span></div>
</div>
<div class="reader" id="reader" hidden></div>
<div class="toast" id="toast"><span id="toastMsg"></span><button id="toastBtn" hidden>Rückgängig</button></div>

<script>
{
/* ================================================================ state */
const KEY = 'brickscan.v1';
const MOCK = /[?&]mock/.test(location.search);
const CAP = window.Capacitor;
const NATIVE = !!(CAP && CAP.nativePromise && CAP.getPlatform && CAP.getPlatform() !== 'web');
const nativeCall = (m, o) => NATIVE ? CAP.nativePromise('PriceView', m, o || {}) : Promise.resolve();
const blank = () => ({items: [], settings: {ck:'', cs:'', tk:'', ts:'', rb:'', currency:'EUR', cond:'U'}, colors: null, rbColors: null, rbParts: {}});
let S = blank();
try { const raw = localStorage.getItem(KEY); if (raw) S = Object.assign(blank(), JSON.parse(raw)); S.settings = Object.assign(blank().settings, S.settings); } catch (e) {}
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) { toast('Speichern fehlgeschlagen – Speicher voll?'); } };
let tab = 'fig', sort = 'new';
try { tab = localStorage.getItem(KEY + '.tab') || 'fig'; } catch (e) {}

/* ================================================================ BrickLink (OAuth 1.0 HMAC-SHA1) */
const BL = 'https://api.bricklink.com/api/store/v1';
const enc = s => encodeURIComponent(String(s)).replace(/[!'()*]/g, c => '%' + c.charCodeAt(0).toString(16).toUpperCase());
async function hmacSha1(key, msg) {
  const te = new TextEncoder();
  const k = await crypto.subtle.importKey('raw', te.encode(key), {name:'HMAC', hash:'SHA-1'}, false, ['sign']);
  const sig = new Uint8Array(await crypto.subtle.sign('HMAC', k, te.encode(msg)));
  let s = ''; sig.forEach(b => s += String.fromCharCode(b)); return btoa(s);
}
async function blGet(path, params = {}) {
  const st = S.settings, url = BL + path;
  const p = Object.fromEntries(Object.entries(params).filter(([, v]) => v !== '' && v != null));
  const oauth = {oauth_consumer_key: st.ck.trim(), oauth_token: st.tk.trim(), oauth_signature_method: 'HMAC-SHA1',
    oauth_timestamp: String(Math.floor(Date.now() / 1000)), oauth_nonce: uid() + uid(), oauth_version: '1.0'};
  const pairs = Object.entries({...p, ...oauth}).map(([k, v]) => [enc(k), enc(v)]).sort((a, b) => a[0] < b[0] ? -1 : a[0] > b[0] ? 1 : a[1] < b[1] ? -1 : a[1] > b[1] ? 1 : 0);
  const base = ['GET', enc(url), enc(pairs.map(x => x.join('=')).join('&'))].join('&');
  oauth.oauth_signature = await hmacSha1(enc(st.cs.trim()) + '&' + enc(st.ts.trim()), base);
  const auth = 'OAuth realm="", ' + Object.entries(oauth).map(([k, v]) => `${k}="${enc(v)}"`).join(', ');
  const qs = new URLSearchParams(p).toString();
  let res;
  try { res = await fetch(url + (qs ? '?' + qs : ''), {headers: {Authorization: auth, Accept: 'application/json'}}); }
  catch (e) { throw new Error('Keine Verbindung zu BrickLink'); }
  let j; try { j = await res.json(); } catch (e) { throw new Error('BrickLink: ungültige Antwort (' + res.status + ')'); }
  const m = j.meta || {};
  if (m.code !== 200) {
    if (m.code === 401) throw new Error('BrickLink lehnt die Schlüssel ab (' + (m.description || m.message || '401') + ')');
    if (m.code === 404) throw new Error('Bei BrickLink nicht gefunden');
    throw new Error('BrickLink ' + (m.code || res.status) + ': ' + (m.message || ''));
  }
  return j.data;
}

/* ================================================================ image prep */
async function prep(file) {
  const url = URL.createObjectURL(file);
  try {
    const img = await new Promise((ok, no) => { const i = new Image(); i.onload = () => ok(i); i.onerror = no; i.src = url; });
    const draw = (max, q) => { const s = Math.min(1, max / Math.max(img.width, img.height)); const c = document.createElement('canvas'); c.width = Math.round(img.width * s); c.height = Math.round(img.height * s); c.getContext('2d').drawImage(img, 0, 0, c.width, c.height); return c; };
    const blob = await new Promise(r => draw(1280, .85).toBlob(r, 'image/jpeg', .85));
    return {blob: blob || file, thumb: draw(180, .7).toDataURL('image/jpeg', .7)};
  } catch (e) { return {blob: file, thumb: ''}; }
  finally { URL.revokeObjectURL(url); }
}

function hexToRgb(h) { h = String(h || '').replace('#',''); if (h.length !== 6) return null; const n = parseInt(h,16); return isNaN(n) ? null : [(n>>16)&255,(n>>8)&255,n&255]; }
function nearestColor(list, rgb) { let best = null, bd = Infinity; for (const c of list) { const cr = hexToRgb(c.rgb); if (!cr) continue; const d = (cr[0]-rgb[0])**2 + (cr[1]-rgb[1])**2 + (cr[2]-rgb[2])**2; if (d < bd) { bd = d; best = c; } } return best; }
function dominantFromData(d, w, h) {
  const med = a => { a.sort((x,y) => x-y); return a[a.length>>1] || 0; };
  const bR = [], bG = [], bB = [], st = Math.max(1, Math.floor((w+h)/120)), at = (x,y) => (y*w+x)*4;
  for (let x=0;x<w;x+=st) for (const y of [0,h-1]) { const i = at(x,y); bR.push(d[i]); bG.push(d[i+1]); bB.push(d[i+2]); }
  for (let y=0;y<h;y+=st) for (const x of [0,w-1]) { const i = at(x,y); bR.push(d[i]); bG.push(d[i+1]); bB.push(d[i+2]); }
  const br = med(bR), bg = med(bG), bb = med(bB); let R=0,G=0,B=0,n=0;
  for (let i=0;i<d.length;i+=4) { const dr=d[i]-br, dg=d[i+1]-bg, db=d[i+2]-bb; if (dr*dr+dg*dg+db*db > 2500) { R+=d[i]; G+=d[i+1]; B+=d[i+2]; n++; } }
  return n ? [Math.round(R/n),Math.round(G/n),Math.round(B/n)] : [br,bg,bb];
}
async function dominantColor(blob) {
  const url = URL.createObjectURL(blob);
  try {
    const img = await loadImg(url);
    const s = Math.min(1, 200/Math.max(img.width,img.height)), w = Math.max(1,Math.round(img.width*s)), h = Math.max(1,Math.round(img.height*s));
    const c = document.createElement('canvas'); c.width=w; c.height=h; const ctx = c.getContext('2d',{willReadFrequently:true}); ctx.drawImage(img,0,0,w,h);
    return dominantFromData(ctx.getImageData(0,0,w,h).data, w, h);
  } catch (e) { return null; } finally { URL.revokeObjectURL(url); }
}

let camStream = null, torchOn = false, torchSupported = false;
const camEl = $('cam'), camVideo = $('camVideo');

async function openCam() {
  if (!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia)) return pickFile(false);
  $('camTitle').textContent = tab === 'fig' ? 'Minifig scannen' : 'Teil scannen';
  $('camMsg').textContent = 'Kamera startet …'; $('camTorch').hidden = true; torchOn = false; torchSupported = false; $('camTorch').setAttribute('aria-pressed', 'false');
  camEl.hidden = false;

    camStream = await navigator.mediaDevices.getUserMedia({audio: false, video: {facingMode: {ideal: 'environment'}, width: {ideal: 1920}, height: {ideal: 1440}}});
    if (camEl.hidden) { stopCam(); return; }

    $('camMsg').textContent = '';
    const track = camStream.getVideoTracks()[0];
    // Dauerhaft scharfstellen, wo das Handy es kann
    try { await track.applyConstraints({advanced: [{focusMode: 'continuous'}]}); } catch (e) {}
    try {
      const caps = track.getCapabilities ? track.getCapabilities() : {};

}
$('camClose').onclick = stopCam;
$('camGal').onclick = () => { stopCam(); pickFile(true); };
$('camTorch').onclick = async () => {
  const track = camStream && camStream.getVideoTracks()[0]; if (!track) return;
  torchOn = !torchOn;
  try { await track.applyConstraints({advanced: [{torch: torchOn}]}); $('camTorch').setAttribute('aria-pressed', String(torchOn)); } catch (e) { torchOn = false; }
};
let capturing = false;
$('camShut').onclick = async () => {
  if (capturing) return;
  const w = camVideo.videoWidth, h = camVideo.videoHeight; if (!w || !h) return;
  capturing = true;
  const track = camStream && camStream.getVideoTracks()[0];
  // Echter Blitz: Licht kurz an, belichten, auslösen, Licht aus
  let flashed = false;
  if (track && torchSupported && !torchOn) {
    try { await track.applyConstraints({advanced: [{torch: true}]}); flashed = true; $('camShut').style.boxShadow = '0 0 0 4px #000, 0 0 60px 20px rgba(255,255,255,.9)'; await sleep(320); } catch (e) {}
  }
  // Direkt in Scangröße aufnehmen – spart das zweite Verkleinern, dadurch schneller
  const max = 1280, sc = Math.min(1, max / Math.max(w, h));
  const c = document.createElement('canvas'); c.width = Math.round(w * sc); c.height = Math.round(h * sc);
  c.getContext('2d').drawImage(camVideo, 0, 0, c.width, c.height);
  const ts = Math.min(1, 180 / Math.max(c.width, c.height));
  const tc = document.createElement('canvas'); tc.width = Math.round(c.width * ts); tc.height = Math.round(c.height * ts);
  tc.getContext('2d').drawImage(c, 0, 0, tc.width, tc.height);
  const thumb = tc.toDataURL('image/jpeg', .7);
  c.toBlob(b => {
    if (flashed && track) track.applyConstraints({advanced: [{torch: false}]}).catch(() => {});
    $('camShut').style.boxShadow = ''; capturing = false;
    stopCam(); if (b) startScan(b, {blob: b, thumb});
  }, 'image/jpeg', .85);
};
document.addEventListener('visibilitychange', () => { if (document.hidden && camStream) stopCam(); });

/* Ein Foto von der nativen System-Kamera holen (Rückkamera). Gibt Blob oder null (Abbruch). */
async function shootOnce() {
  const Cam = window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins.RearCamera;
  if (!(NATIVE && Cam)) return null; // kein nativer Pfad -> Aufrufer nutzt Datei-Auswahl
  let res;
  try { res = await Cam.shoot(); } catch (e) { return null; }
  const path = res && res.path; if (!path) return null;
  try {
    const url = window.Capacitor.convertFileSrc(path.startsWith('file://') ? path : 'file://' + path);
    const blob = await (await fetch(url)).blob();
    return blob && blob.size ? blob : null;
  } catch (e) { return null; }
}
/* Einzelscan: Foto -> Bestätigen-Fenster */
async function shoot() {
  if (!(NATIVE && window.Capacitor.Plugins.RearCamera)) return pickFile(false);
  const blob = await shootOnce();
  if (blob) startScan(blob); // null = abgebrochen
}
/* Schnell-Scan: Foto -> Top-Treffer sofort übernehmen -> gleich wieder Kamera, bis Abbruch */
let bulkRunning = false;
async function bulkShoot() {
  if (!(NATIVE && window.Capacitor.Plugins.RearCamera)) { toast('Schnell-Scan braucht die native Kamera'); return; }
  if (bulkRunning) return; bulkRunning = true;
  let added = 0;
  try {
    while (bulk) {
      const blob = await shootOnce();
      if (!blob) break; // Abbruch beendet den Schnell-Scan
      const kind = tab;
      try {
        const {blob: small, thumb} = await prep(blob);
        const cands = await recognize(kind === 'fig' ? 'figs' : 'parts', small);
        if (!cands.length) { toast('Nicht erkannt – nochmal'); continue; }
        const c = cands[0];
        const {item, dup} = await commitItem({kind, no: c.no, name: c.name, img2: c.img, color_id: null, color_name: null, color_rgb: null}, {cond: S.settings.cond || 'U', qty: 1, photo: thumb});
        added++; render();
        toast(`${dup ? 'jetzt ' + item.qty + '× ' : ''}${item.name}${needsColor(item) ? ' · Farbe fehlt' : ''}`);
      } catch (e) { toast(short(e)); }
    }
  } finally { bulkRunning = false; if (added) toast(`Schnell-Scan beendet – ${added} erfasst`); }
}
function short(e) { const m = String(e && (e.message || e)); return m.length > 80 ? m.slice(0, 80) : m; }
$('btnScan').onclick = () => multi ? multiShoot() : (bulk ? bulkShoot() : shoot());
$('btnGallery').onclick = () => pickFile(true);
for (const id of ['fileCam','fileGal']) $(id).addEventListener('change', e => { const f = e.target.files && e.target.files[0]; if (f) startScan(f); });
let bulk = false, multi = false;
try { bulk = localStorage.getItem(KEY + '.bulk') === '1'; multi = localStorage.getItem(KEY + '.multi') === '1'; } catch (e) {}
function scanLabelText() { return multi ? 'Multi-Foto' : (bulk ? 'Schnell-Scan' : (tab === 'fig' ? 'Minifig scannen' : 'Teil scannen')); }
function setBulk(v) { bulk = v; if (v) { multi = false; try { localStorage.setItem(KEY + '.multi', '0'); } catch (e) {} $('btnMulti').setAttribute('aria-pressed', 'false'); } try { localStorage.setItem(KEY + '.bulk', v ? '1' : '0'); } catch (e) {} $('btnBulk').setAttribute('aria-pressed', String(v)); $('scanLabel').textContent = scanLabelText(); }

/* ---------- Multi-Foto: mehrere Teile auf hellem Untergrund, ausschneiden und je erkennen */
function loadImg(url) { return new Promise((ok, no) => { const i = new Image(); i.onload = () => ok(i); i.onerror = no; i.src = url; }); }
function pickImage() { return new Promise(res => { const inp = $('fileMulti'); const h = () => { inp.removeEventListener('change', h); res((inp.files && inp.files[0]) || null); }; inp.value = ''; inp.addEventListener('change', h); inp.click(); }); }
async function segment(blob) {
  const url = URL.createObjectURL(blob);
  try {
    const img = await loadImg(url);
    const W = img.width, H = img.height, scale = Math.min(1, 900 / Math.max(W, H));
    const w = Math.max(1, Math.round(W * scale)), h = Math.max(1, Math.round(H * scale));
    const c = document.createElement('canvas'); c.width = w; c.height = h;
    const ctx = c.getContext('2d', {willReadFrequently: true}); ctx.drawImage(img, 0, 0, w, h);
    const data = ctx.getImageData(0, 0, w, h).data;
    const med = arr => { arr.sort((a, b) => a - b); return arr[arr.length >> 1] || 0; };
    const bR = [], bG = [], bB = [], step = Math.max(1, Math.floor((w + h) / 240));
    const at = (x, y) => (y * w + x) * 4;
    for (let x = 0; x < w; x += step) { for (const y of [0, h - 1]) { const i = at(x, y); bR.push(data[i]); bG.push(data[i + 1]); bB.push(data[i + 2]); } }
    for (let y = 0; y < h; y += step) { for (const x of [0, w - 1]) { const i = at(x, y); bR.push(data[i]); bG.push(data[i + 1]); bB.push(data[i + 2]); } }
    const br = med(bR), bg = med(bG), bb = med(bB);
    const N = w * h, mask = new Uint8Array(N), thr = 58 * 58;
    for (let p = 0, i = 0; p < N; p++, i += 4) { const dr = data[i] - br, dg = data[i + 1] - bg, db = data[i + 2] - bb; if (dr * dr + dg * dg + db * db > thr) mask[p] = 1; }
    const label = new Int32Array(N), stack = new Int32Array(N), boxes = []; let lab = 0;
    for (let p0 = 0; p0 < N; p0++) {
      if (!mask[p0] || label[p0]) continue;
      lab++; let sp = 0; stack[sp++] = p0; label[p0] = lab;
      let minx = w, miny = h, maxx = 0, maxy = 0, area = 0;
      while (sp) { const q = stack[--sp], qx = q % w, qy = (q / w) | 0; area++;
        if (qx < minx) minx = qx; if (qx > maxx) maxx = qx; if (qy < miny) miny = qy; if (qy > maxy) maxy = qy;
        if (qx > 0) { const n = q - 1; if (mask[n] && !label[n]) { label[n] = lab; stack[sp++] = n; } }
        if (qx < w - 1) { const n = q + 1; if (mask[n] && !label[n]) { label[n] = lab; stack[sp++] = n; } }
        if (qy > 0) { const n = q - w; if (mask[n] && !label[n]) { label[n] = lab; stack[sp++] = n; } }
        if (qy < h - 1) { const n = q + w; if (mask[n] && !label[n]) { label[n] = lab; stack[sp++] = n; } }
      }
      boxes.push({minx, miny, maxx, maxy, area});
    }
    const A = w * h;
    let cand = boxes.filter(b => { const bw = b.maxx - b.minx + 1, bh = b.maxy - b.miny + 1; return b.area > A * 0.004 && b.area < A * 0.6 && bw > 14 && bh > 14; });
    cand.sort((a, b) => b.area - a.area); cand = cand.slice(0, 20);
    const crops = [];
    for (const b of cand) {
      const bw = b.maxx - b.minx, bh = b.maxy - b.miny, pad = 0.12;
      let x0 = (b.minx - bw * pad) / scale, y0 = (b.miny - bh * pad) / scale, x1 = (b.maxx + bw * pad) / scale, y1 = (b.maxy + bh * pad) / scale;
      x0 = Math.max(0, x0); y0 = Math.max(0, y0); x1 = Math.min(W, x1); y1 = Math.min(H, y1);
      const cw = Math.round(x1 - x0), ch = Math.round(y1 - y0); if (cw < 10 || ch < 10) continue;
      const m = Math.min(1, 640 / Math.max(cw, ch)), ccx = document.createElement('canvas'); ccx.width = Math.round(cw * m); ccx.height = Math.round(ch * m);
      const cctx = ccx.getContext('2d', {willReadFrequently: true}); cctx.drawImage(img, x0, y0, cw, ch, 0, 0, ccx.width, ccx.height);
      const rgb = dominantFromData(cctx.getImageData(0, 0, ccx.width, ccx.height).data, ccx.width, ccx.height);
      const cblob = await new Promise(r => ccx.toBlob(r, 'image/jpeg', .85));
      const tm = Math.min(1, 120 / Math.max(ccx.width, ccx.height)), tc = document.createElement('canvas'); tc.width = Math.round(ccx.width * tm); tc.height = Math.round(ccx.height * tm);
      tc.getContext('2d').drawImage(ccx, 0, 0, tc.width, tc.height);
      crops.push({blob: cblob, thumb: tc.toDataURL('image/jpeg', .6), rgb, cx: b.minx + b.maxx, cy: b.miny + b.maxy});
    }
    crops.sort((a, b) => (a.cy - b.cy) || (a.cx - b.cx));
    return crops;
  } finally { URL.revokeObjectURL(url); }
}
let multiRows = [], multiKind = 'part';
async function multiShoot() {
  multiKind = tab;
  const blob = (NATIVE && window.Capacitor.Plugins.RearCamera) ? await shootOnce() : await pickImage();
  if (!blob) return;
  openSheet(`<h2>Teile werden gesucht …</h2><div class="spin"></div><p class="center">Das Foto wird in einzelne Teile zerlegt</p>`);
  let crops;
  try { crops = await segment(blob); } catch (e) { crops = []; }
  if (!crops.length) {
    openSheet(`<h2>Keine einzelnen Teile erkannt</h2><p>Für Multi-Foto die Teile einzeln, mit etwas Abstand, auf einen hellen, ruhigen Untergrund legen (z. B. weißes Blatt).</p><div class="acts"><button class="btn pri" data-mact="rescan">Neues Foto</button><button class="btn" data-act="close">Abbrechen</button></div>`);
    return;
  }
  if (multiKind === 'part' && blReady() && !S.colors) { try { await allColors(); } catch (e) {} }
  multiRows = [];
  for (let i = 0; i < crops.length; i++) {
    openSheet(`<h2>Teile werden erkannt …</h2><div class="spin"></div><p class="center">${i + 1} von ${crops.length}</p>`);
    try {
      const cands = await recognize(multiKind === 'fig' ? 'figs' : 'parts', crops[i].blob);
      if (cands.length) { const g = multiKind === 'part' ? guessColor(crops[i].rgb) : null; multiRows.push({thumb: crops[i].thumb, cands: cands.slice(0, 4), guess: g}); }
    } catch (e) {}
  }
  if (!multiRows.length) { openSheet(`<h2>Nichts erkannt</h2><p>Die ausgeschnittenen Teile konnten nicht zugeordnet werden. Versuch es mit besserem Licht und ruhigem Hintergrund.</p><div class="acts"><button class="btn pri" data-mact="rescan">Neues Foto</button><button class="btn" data-act="close">Abbrechen</button></div>`); return; }
  drawMulti();
}
function drawMulti() {
  const isPart = multiKind === 'part';
  openSheet(`<h2>${multiRows.length} ${isPart ? 'Teile' : 'Minifigs'} gefunden</h2>
    <p class="center" style="text-align:left;font-size:14px;margin:2px 0 10px">Haken = übernehmen. Treffer prüfen${isPart ? ', Farbe ist automatisch geschätzt (anpassbar)' : ''} und Anzahl anpassen.</p>
    <div class="mgrid">${multiRows.map((r, i) => `<div class="mrow" data-mi="${i}">
      <img class="mthumb" src="${esc(r.thumb)}" alt="">

        <div class="mline">${isPart ? `<input class="mc" id="mcol${i}" placeholder="Farbe" autocapitalize="words" value="${esc(r.guess ? r.guess.name : '')}">` : '<span></span>'}<input class="mq" id="mqty${i}" inputmode="numeric" value="1" aria-label="Anzahl"></div></div>
      <input class="minc" type="checkbox" id="minc${i}" checked aria-label="übernehmen"></div>`).join('')}</div>
    <div class="acts"><button class="btn pri" data-mact="addall">Ausgewählte hinzufügen</button><button class="btn" data-mact="rescan">Neues Foto</button></div>`);
}
async function multiAddAll(btn) {
  if (btn) { btn.disabled = true; btn.textContent = 'wird hinzugefügt …'; }
  let n = 0;
  for (let i = 0; i < multiRows.length; i++) {
    const inc = $('minc' + i); if (!inc || !inc.checked) continue;
    const r = multiRows[i], ci = parseInt(($('mcand' + i) || {}).value || '0', 10) || 0, c = r.cands[ci]; if (!c) continue;
    const colTxt = multiKind === 'part' ? (($('mcol' + i) || {}).value || '').trim() : '';
    const qty = Math.max(1, parseInt(($('mqty' + i) || {}).value || '1', 10) || 1);
    // Wenn der automatische Farbvorschlag unverändert übernommen wurde, auch die color_id (für die Set-Suche) mitnehmen
    let color_id = null, color_rgb = null, color_name = colTxt || null;
    if (multiKind === 'part' && r.guess && colTxt === r.guess.name) { color_id = r.guess.id || null; color_rgb = r.guess.rgb || null; }
    await commitItem({kind: multiKind, no: c.no, name: c.name, img2: c.img, color_id, color_name, color_rgb}, {cond: S.settings.cond || 'U', qty, photo: r.thumb});
    n++;
  }
  tab = multiKind; closeSheet(); render();
  toast(n ? `${n} hinzugefügt${multiKind === 'part' ? ' – Farben ggf. nachtragen' : ''}` : 'Nichts ausgewählt');
}

async function startScan(file, pre) {
  const kind = tab;
  scan = {kind, cands: [], sel: 0, cond: S.settings.cond || 'U', qty: 1, colors: null, color: '', manual: false, photo: ''};
  const my = scan;
  openSheet(`<h2>${kind === 'fig' ? 'Minifig' : 'Teil'} wird erkannt …</h2><div class="spin"></div><p class="center">Brickognize vergleicht dein Foto</p>`);
  try {
    const {blob, thumb} = pre || await prep(file);
    my.photo = thumb;
    if (kind === 'part') { try { my.rgb = await dominantColor(blob); } catch (e) {} }
    my.cands = await recognize(kind === 'fig' ? 'figs' : 'parts', blob);
    if (scan !== my) return;
    if (!my.cands.length) my.manual = true;
    // Ohne BrickLink-Schlüssel: Farbe aus der eingebauten Liste automatisch vorauswählen (echte Farb-Nummer)
    if (kind === 'part' && !blReady() && my.rgb && !my.color) { const g = guessColor(my.rgb); if (g) my.color = String(g.id); }
    drawScan(); if (kind === 'part' && my.cands.length) loadColors();
  } catch (e) {
    if (scan !== my) return;
    openSheet(`<h2>Das hat nicht geklappt</h2><p>${esc(e.message)}</p><div class="acts"><button class="btn pri" data-act="rescan">Nochmal scannen</button><button class="btn" data-act="manual">Nummer selbst eingeben</button><button class="btn" data-act="close">Abbrechen</button></div>`);
  }
}
async function loadColors() {
  const my = scan; if (!my || my.kind !== 'part') return;
  const c = my.cands[my.sel]; if (!c) return;
  my.colors = null; my.colorErr = ''; drawScan();
  if (!blReady()) { my.colors = []; return; }
  try { const cols = await knownColors(c.no); if (scan === my && my.cands[my.sel] === c) { my.colors = cols; if (!cols.some(x => String(x.id) === String(my.color))) my.color = ''; if (!my.color && my.rgb && cols.length) { const g = nearestColor(cols, my.rgb); if (g) my.color = String(g.id); } drawScan(); } }
  catch (e) { if (scan === my) { my.colors = []; my.colorErr = e.message; drawScan(); } }
}

      ${isPart && !s.manual && !blReady() ? `<label>Farbe<select id="colorSel">${paletteOptions(s.color)}</select></label>` : ''}

        : `<select id="color"><option value="">Alle Farben (Durchschnitt)</option>${s.colors.map(c => `<option value="${esc(c.id)}" ${String(c.id) === String(s.color) ? 'selected' : ''}>${esc(c.name)}</option>`).join('')}</select>`}</label>` : ''}

  if (s.manual) {
    openSheet(`<h2>Nummer selbst eingeben</h2>

      ${isPart ? `<label class="field">Farb-ID (optional, BrickLink)<input id="mColor" inputmode="numeric" placeholder="z. B. 5 für Rot"></label>` : ''}
      ${optsHtml.replace(/<label>Farbe[\s\S]*?<\/label>/, '')}
      <div class="acts"><button class="btn pri" data-act="addManual">Zur Liste hinzufügen</button>${s.cands.length ? '<button class="btn" data-act="back">Zurück zu den Treffern</button>' : '<button class="btn" data-act="rescan">Nochmal scannen</button>'}</div>`);
    return;
  }
  openSheet(`<div class="photo">${s.photo ? `<img src="${esc(s.photo)}" alt="Dein Foto">` : ''}<div><h2 style="margin:0">Ist es das richtige ${isPart ? 'Teil' : 'Minifig'}?</h2><p class="center" style="text-align:left;margin:4px 0 0;font-size:14px">Tippe auf den passenden Treffer.</p></div></div>
    <div class="cands" role="radiogroup">${s.cands.map((c, i) => `<button class="cand" role="radio" aria-checked="${i === s.sel}" data-sel="${i}">
        <div class="thumb"><img src="${esc(safeUrl(c.img))}" alt=""></div>
        <div><div class="nm">${esc(c.name)}</div><div class="meta"><span>${esc(c.no)}</span>${c.category ? `<span>${esc(c.category)}</span>` : ''}</div><div class="meter"><i style="width:${Math.round((c.score || 0) * 100)}%;background:${c.score >= .7 ? 'var(--ok)' : c.score >= .4 ? 'var(--y2)' : 'var(--r)'}"></i></div></div>
        <span class="score">${Math.round((c.score || 0) * 100)} %</span></button>`).join('')}</div>
    <button class="link" data-act="manual">Nicht dabei? Nummer selbst eingeben</button>
    ${optsHtml}
    <div class="acts"><button class="btn pri" data-act="add">Ja, zur Liste hinzufügen</button><button class="btn" data-act="rescan">Nein, nochmal scannen</button></div>`);

/* Kern: Eintrag anlegen oder – wenn schon vorhanden – Anzahl erhöhen. Holt den Preis. */
async function commitItem(base, opt) {
  const it = Object.assign({uid: uid(), added: Date.now(), cond: opt.cond, qty: opt.qty, price: null, currency: cur(), src: 'none', photo: opt.photo || ''}, base);
  it.img = blImg(it.kind, it.no, it.color_id) || it.img2 || '';
  const dup = S.items.find(x => matchKey(x) === matchKey(it));
  if (dup) { dup.qty += it.qty; dup.added = Date.now(); save(); return {item: dup, dup: true}; }
  await applyPrice(it);
  S.items.push(it); save();
  return {item: it, dup: false};
}
async function addItem(base) {
  const s = scan;
  const btn = sheet.querySelector('[data-act^=add]'); if (btn) { btn.disabled = true; btn.textContent = 'Preis wird geholt …'; }
  const {item, dup} = await commitItem(base, {cond: s.cond, qty: s.qty, photo: s.photo});
  tab = item.kind; closeSheet(); render();
  if (!blReady() && item.price == null) return openReader(item);
  if (dup) return toast(`Schon in der Liste – jetzt ${item.qty}× (${money((item.price || 0) * item.qty, item.currency, true)})`);
  if (needsColor(item)) toast(`${item.name}: ${money(item.price * item.qty, item.currency, true)} – bitte Farbe wählen`);
  else toast(item.price != null ? `${item.name}: ${money(item.price * item.qty, item.currency, true)}` : `${item.name} hinzugefügt – ${item.err || 'kein Preis gefunden'}`);
}

/* ---------- Set-Finder: welche Sets ergeben deine Teile? (nutzt BrickLink supersets/subsets) */
const finder = $('finder');
let finderBusy = false, finderCancel = false;
// Wie viele Stück dieses Teils/Minifigs besitzt der Nutzer (Zustand egal)
function ownedQty(no, isFig, colorId) {
  const kind = isFig ? 'fig' : 'part';
  return S.items.filter(i => i.kind === kind && String(i.no).toLowerCase() === String(no).toLowerCase() && (isFig || String(i.color_id || '') === String(colorId || ''))).reduce((a, i) => a + i.qty, 0);
}
function finderShell(inner) {
  finder.innerHTML = `<div class="fhead"><button class="icon-btn" id="finderClose" aria-label="Schließen" style="margin:0;background:rgba(0,0,0,.08);color:#1a1a1a"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg></button><span>Sets finden</span></div><div class="fbody" id="finderBody">${inner}</div>`;
  finder.hidden = false;
}
function closeFinder() { finderCancel = true; finder.hidden = true; finder.innerHTML = ''; }
finder.addEventListener('click', e => {
  const t = e.target.closest('button'); if (!t) return;
  if (t.id === 'finderClose') return closeFinder();
  if (t.id === 'finderStop') { finderCancel = true; t.textContent = 'wird beendet …'; }
});
async function mSuper(it) { await sleep(60); const sets = it.kind === 'fig' ? [['sw0001a-set', 'Battle Pack']] : [['8360-1', 'Schwebejet'], ['10001-1', 'Großes Set']]; return [{color_id: it.color_id || 0, entries: sets.map(([no, name]) => ({item: {type: 'SET', no, name}, quantity: 1}))}]; }
async function mSub() { await sleep(60); const base = S.items.slice(0, 3).map(it => ({entries: [{item: {type: it.kind === 'fig' ? 'MINIFIG' : 'PART', no: it.no}, color_id: it.color_id || 0, quantity: 2, is_alternate: false, is_counterpart: false}]})); base.push({entries: [{item: {type: 'PART', no: '9999'}, color_id: 1, quantity: 5, is_alternate: false, is_counterpart: false}]}); return base; }
function finderSource() {
  if (/[?&]src=rb/.test(location.search)) return rbReady() ? 'rb' : null;
  if (blReady()) return 'bl';
  if (rbReady()) return 'rb';
  return null;
}
async function findSets() {
  const src = finderSource();
  if (!src) return openSettings();
  const mine = src === 'rb'
    ? S.items.filter(i => i.kind === 'part' && i.color_id) // Rebrickable: Teile mit Farbe (Minifigs nur über BrickLink)
    : S.items.filter(i => i.kind === 'fig' || (i.kind === 'part' && i.color_id));
  if (!mine.length) { toast(src === 'rb' ? 'Erst Teile mit Farbe scannen' : 'Erst Teile oder Minifigs scannen'); return; }
  if (finderBusy) return; finderBusy = true; finderCancel = false;
  const srcName = src === 'rb' ? 'Rebrickable' : 'BrickLink';
  finderShell(`<p class="fnote">Ich schaue bei ${srcName} nach, in welchen Sets deine ${mine.length} Teile vorkommen, und rechne aus, wie vollständig jedes Set bei dir ist. Das kann einen Moment dauern.</p>
    <p id="fstep">Schritt 1 von 2: Teile nachschlagen …</p><div class="fprog"><i id="fbar" style="width:0%"></i></div>
    <button class="btn" id="finderStop" style="height:46px">Abbrechen</button>`);
  const prog = (step, frac, txt) => { $('fstep') && ($('fstep').textContent = txt); $('fbar') && ($('fbar').style.width = Math.round((step === 1 ? 0 : 50) + frac * 50) + '%'); };
  try {
    let results;
    if (src === 'rb') results = await findSetsRb(mine, prog);
    else results = await findSetsBl(mine, prog);
    if (finderCancel) { closeFinder(); return; }
    if (results === null) return; // Meldung schon gesetzt
    results.sort((a, b) => b.pct - a.pct || b.haveKinds - a.haveKinds);
    renderFinder(results, srcName);
  } catch (e) {
    finderShell(`<p class="fnote">Das hat nicht geklappt: ${esc(short(e))}</p>`);
  } finally { finderBusy = false; }
}
async function findSetsBl(mine, prog) {
  const hits = {}; const cap = Math.min(mine.length, 120);
  for (let k = 0; k < cap; k++) {
    if (finderCancel) return null;
    const it = mine[k];
    prog(1, (k + 1) / cap, `Schritt 1 von 2: Teile nachschlagen (${k + 1}/${cap}) …`);
    try {
      const data = MOCK ? await mSuper(it) : (it.kind === 'fig'
        ? await blGet(`/items/MINIFIG/${encodeURIComponent(it.no)}/supersets`)
        : await blGet(`/items/PART/${encodeURIComponent(it.no)}/supersets`, {color_id: it.color_id}));
      for (const grp of data || []) for (const e of grp.entries || []) {
        if (!e.item || e.item.type !== 'SET') continue;
        (hits[e.item.no] = hits[e.item.no] || {name: e.item.name, members: new Set()}).members.add(matchKey(it));
      }
    } catch (e) {}
    await sleep(130);
  }
  const cands = pickCands(hits);
  if (!cands.length) { finderShell(`<p class="fnote">Zu deinen Teilen wurde kein passendes Set gefunden. Scanne mehr Teile (mit Farbe), dann klappt es besser.</p>`); return null; }
  const results = [];
  for (let k = 0; k < cands.length; k++) {
    if (finderCancel) break;
    const cand = cands[k];
    prog(2, (k + 1) / cands.length, `Schritt 2 von 2: Sets prüfen (${k + 1}/${cands.length}) …`);
    try {
      const subs = MOCK ? await mSub() : await blGet(`/items/SET/${encodeURIComponent(cand.no)}/subsets`);
      let req = 0, have = 0, kinds = 0, haveKinds = 0;
      for (const grp of subs || []) {
        const entry = (grp.entries || []).find(e => !e.is_alternate && !e.is_counterpart) || (grp.entries || [])[0];
        if (!entry || entry.is_counterpart || !entry.item) continue;
        const type = entry.item.type;
        if (type !== 'PART' && type !== 'MINIFIG') continue;
        const need = entry.quantity || 0; if (!need) continue;
        const own = ownedQty(entry.item.no, type === 'MINIFIG', entry.color_id);
        req += need; have += Math.min(need, own); kinds++; if (own > 0) haveKinds++;
      }
      if (req) results.push({no: cand.no, name: cand.name, req, have, kinds, haveKinds, pct: Math.round(have / req * 100), img: `https://img.bricklink.com/ItemImage/SN/0/${encodeURIComponent(cand.no)}.png`, link: `https://www.bricklink.com/v2/catalog/catalogitem.page?S=${encodeURIComponent(cand.no)}`});
    } catch (e) {}
    await sleep(130);
  }
  return results;
}
async function findSetsRb(mine, prog) {
  const cmap = await rbColorMap();
  // Besitz in Rebrickable-Schlüsseln: partNum|rbColor -> Stückzahl
  const owned = {}; const rbItems = [];
  const cap = Math.min(mine.length, 120);
  for (let k = 0; k < cap; k++) {
    if (finderCancel) return null;
    const it = mine[k];
    prog(1, (k + 1) / cap * 0.5, `Schritt 1 von 2: Teile nachschlagen (${k + 1}/${cap}) …`);
    const rbc = cmap[it.color_id]; if (rbc == null) continue;
    let pn; try { pn = await rbPartNum(it.no); } catch (e) { continue; }
    if (!pn) continue;
    const key = pn + '|' + rbc;
    owned[key] = (owned[key] || 0) + it.qty;
    rbItems.push({pn, rbc, member: key});
    await sleep(120);
  }
  // Kandidaten-Sets über Reverse-Lookup
  const hits = {}; const seen = new Set();
  for (let k = 0; k < rbItems.length; k++) {
    if (finderCancel) return null;
    const r = rbItems[k]; const dkey = r.pn + '|' + r.rbc; if (seen.has(dkey)) continue; seen.add(dkey);
    prog(1, 0.5 + (k + 1) / rbItems.length * 0.5, `Schritt 1 von 2: Sets suchen (${k + 1}/${rbItems.length}) …`);
    try {
      const sets = await rbPartSets(r.pn, r.rbc);
      for (const s of sets || []) (hits[s.set_num] = hits[s.set_num] || {name: s.set_name || s.set_num, img: s.set_img_url, members: new Set()}).members.add(r.member);
    } catch (e) {}
    await sleep(140);
  }
  const cands = pickCands(hits);
  if (!cands.length) { finderShell(`<p class="fnote">Zu deinen Teilen wurde über Rebrickable kein passendes Set gefunden. Scanne mehr Teile mit Farbe.</p>`); return null; }
  const results = [];
  for (let k = 0; k < cands.length; k++) {
    if (finderCancel) break;
    const cand = cands[k];
    prog(2, (k + 1) / cands.length, `Schritt 2 von 2: Sets prüfen (${k + 1}/${cands.length}) …`);
    try {
      const parts = await rbSetParts(cand.no);
      let req = 0, have = 0, kinds = 0, haveKinds = 0;
      for (const p of parts || []) {
        if (p.is_spare) continue;
        const need = p.quantity || 0; if (!need) continue;
        const own = owned[(p.part && p.part.part_num) + '|' + (p.color && p.color.id)] || 0;
        req += need; have += Math.min(need, own); kinds++; if (own > 0) haveKinds++;
      }
      if (req) results.push({no: cand.no, name: cand.name, req, have, kinds, haveKinds, pct: Math.round(have / req * 100), img: cand.img || `https://cdn.rebrickable.com/media/sets/${encodeURIComponent(cand.no)}.jpg`, link: `https://rebrickable.com/sets/${encodeURIComponent(cand.no)}/`});
    } catch (e) {}
    await sleep(140);
  }
  return results;
}
function pickCands(hits) {
  let cands = Object.entries(hits).map(([no, v]) => ({no, name: v.name, img: v.img, overlap: v.members.size})).sort((a, b) => b.overlap - a.overlap);
  const multi = cands.filter(c => c.overlap >= 2);
  return (multi.length ? multi : cands).slice(0, 25);
}
function renderFinder(results, srcName) {
  if (!results || !results.length) { finderShell(`<p class="fnote">Keine Sets berechnet. Versuch es mit mehr gescannten Teilen.</p>`); return; }
  const col = p => p >= 90 ? 'var(--ok)' : p >= 50 ? 'var(--y2)' : 'var(--r)';
  finderShell(`<p class="fnote">Quelle: ${esc(srcName || 'BrickLink')}. Sortiert nach Vollständigkeit – die Prozentzahl zählt die Teile-Stückzahl, die du von diesem Set schon hast.</p>` +
    results.map(r => `<a class="setrow" href="${esc(r.link)}" target="_blank" rel="noopener">
      <div class="thumb"><img src="${esc(r.img)}" alt="" loading="lazy"></div>
      <div><div class="nm">${esc(r.name)}</div><div class="meta"><span>${esc(r.no)}</span><span>${r.haveKinds}/${r.kinds} versch. Teile</span><span>${r.have}/${r.req} Stück</span></div><div class="bar2"><i style="width:${r.pct}%;background:${col(r.pct)}"></i></div></div>
      <span class="pct" style="color:${col(r.pct)}">${r.pct}%</span></a>`).join(''));
}
$('btnFinder').onclick = findSets;

/* ---------- refresh all */
let refreshing = false;
async function refreshAll() {
  if (refreshing) return;
  if (!blReady()) { openSettings(); return; }
  const todo = S.items.filter(i => i.src !== 'manual'); if (!todo.length) { toast('Nichts zu aktualisieren'); return; }
  refreshing = true; const lab = $('btnRefresh').querySelector('span');
  let n = 0, bad = 0;
  for (const it of todo) { lab.textContent = `${++n}/${todo.length}`; it.src = 'none'; await applyPrice(it); if (it.err) bad++; render(); await sleep(120); }
  save(); refreshing = false; lab.textContent = 'Preise neu'; render();
  toast(bad ? `${todo.length - bad} aktualisiert, ${bad} mit Fehler` : 'Alle Preise aktualisiert');
}

/* ================================================================ events */
for (const k of ['fig','part']) $('tab-' + k).onclick = () => { tab = k; try { localStorage.setItem(KEY + '.tab', k); } catch (e) {} render(); window.scrollTo({top: 0}); };
$('sort').onchange = e => { sort = e.target.value; render(); };
$('btnRefresh').onclick = refreshAll;
$('btnSettings').onclick = openSettings;
$('btnSetup').onclick = openSettings;
$('list').addEventListener('click', e => { const b = e.target.closest('.item'); if (b) openItem(b.dataset.uid); });

sheet.addEventListener('click', e => {
  const t = e.target.closest('button'); if (!t) return;
  const d = t.dataset;
  if (d.act) {
    const s = scan;
    if (d.act === 'close') return closeSheet();
    if (d.act === 'rescan') { const k = tab; closeSheet(); tab = k; return shoot(); }
    if (d.act === 'manual') { if (!scan) scan = {kind: tab, cands: [], sel: 0, cond: S.settings.cond || 'U', qty: 1, photo: ''}; scan.manual = true; return drawScan(); }
    if (d.act === 'back') { s.manual = false; drawScan(); if (s.kind === 'part' && s.colors == null) loadColors(); return; }
    if (d.act === 'add') {
      const c = s.cands[s.sel];
      // Farbe aus der jeweiligen Auswahl (mit Schlüssel: BrickLink-Liste, sonst eingebaute Liste) – beide liefern eine Farb-Nummer
      const col = s.kind === 'part' && s.color ? (blReady() && S.colors ? S.colors[s.color] : curColor(s.color)) : null;
      // Farbe für Teile Pflicht
      if (s.kind === 'part' && !col) { const sel = $('color') || $('colorSel'); if (sel) { sel.focus(); sel.style.borderColor = 'var(--r)'; } return toast('Bitte zuerst die Farbe wählen'); }
      return addItem({kind: s.kind, no: c.no, name: c.name, img2: c.img, color_id: col ? col.id : null, color_name: col ? col.name : null, color_rgb: col ? col.rgb : null});
    }
    if (d.act === 'addManual') {
      const no = $('mNo').value.trim(); if (!no) { $('mNo').focus(); return toast('Bitte BrickLink-Nummer eingeben'); }
      const cid = s.kind === 'part' ? parseInt($('mColor').value, 10) || null : null; const col = cid && S.colors ? S.colors[cid] : null;
      return addItem({kind: s.kind, no, name: $('mName').value.trim() || no, img2: '', color_id: cid, color_name: col ? col.name : (cid ? 'Farbe ' + cid : null), color_rgb: col ? col.rgb : null});
    }
  }
  if (d.sel != null && scan) { const i = +d.sel; if (i !== scan.sel) { scan.sel = i; drawScan(); if (scan.kind === 'part') loadColors(); } return; }
  if (d.cond && scan) { scan.cond = d.cond; return drawScan(); }
  if (d.q && scan) { scan.qty = Math.max(1, (parseInt($('qty').value, 10) || 1) + +d.q); $('qty').value = scan.qty; return; }
  if (d.iq || d.icond) {
    const it = S.items.find(i => i.uid === sheet.dataset.uid); if (!it) return;
    if (d.iq) { it.qty = Math.max(1, (parseInt($('iqty').value, 10) || 1) + +d.iq); save(); render(); return openItem(it.uid); }
    if (d.icond !== it.cond) { it.cond = d.icond; t.parentNode.querySelectorAll('button').forEach(b => b.setAttribute('aria-pressed', String(b === t))); (async () => { await applyPrice(it); save(); render(); openItem(it.uid); })(); }
    return;
  }
  if (d.iact) return itemAction(d.iact, t);
  if (d.scond) { t.parentNode.querySelectorAll('button').forEach(b => b.setAttribute('aria-pressed', String(b === t))); return; }
  if (d.sact) return settingsAction(d.sact, t);
  if (d.mact === 'rescan') { closeSheet(); return multiShoot(); }
  if (d.mact === 'addall') return multiAddAll(t);
});
sheet.addEventListener('input', e => { if (e.target.id === 'colorTxt' && scan) scan.colorTxt = e.target.value; });
sheet.addEventListener('change', e => {
  if (e.target.id && /^minc\d+$/.test(e.target.id)) { const row = e.target.closest('.mrow'); if (row) row.classList.toggle('off', !e.target.checked); return; }
  if ((e.target.id === 'color' || e.target.id === 'colorSel') && scan) scan.color = e.target.value;
  if (e.target.id === 'colorTxt' && scan) scan.colorTxt = e.target.value;
  if (e.target.id === 'qty' && scan) scan.qty = Math.max(1, parseInt(e.target.value, 10) || 1);
  if (e.target.id === 'iqty') { const it = S.items.find(i => i.uid === sheet.dataset.uid); if (it) { it.qty = Math.max(1, parseInt(e.target.value, 10) || 1); save(); render(); openItem(it.uid); } }
});

/* Zurück-Taste des Handys: schließt zuerst offene Fenster, statt die App zu beenden */
const App = window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins.App;
if (App && App.addListener) {
  App.addListener('backButton', () => {
    if (!finder.hidden) { closeFinder(); return; }            // Set-Finder
    if (!$('reader').hidden) { closeReader(); return; }      // Preis-Fenster
    if (!camEl.hidden) { stopCam(); return; }                 // (falls doch Kamera-Overlay)
    if (veil.classList.contains('open')) { closeSheet(); return; } // Eingabe-/Detail-Fenster
    if (tab !== 'fig') { tab = 'fig'; try { localStorage.setItem(KEY + '.tab', 'fig'); } catch (e) {} render(); return; }
    App.exitApp();
  });
}

render();
}
