<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FFCF00">
<title>BrickScan</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
/* VOICE: freundlich, griffig, wie ein Sortierkasten
   IDEA: Liste = Sammelkasten, Kopf = gelbe Preis-Banderole
   PICTURE: die Teilebilder selbst
   COLOUR/TYPE: LEGO-Gelb, Rot als Aktion, Rubik
   LAYOUT: Kopf mit Summe, 2 Tabs, Liste, Scan-Leiste unten */
:root{color-scheme:light dark;
  --y:#FFCF00;--y2:#F2B700;--r:#D01012;--r2:#A80C0E;
  --bg:light-dark(#ffffff,#121212);--card:light-dark(#f4f4f2,#1d1d1d);--line:light-dark(#e4e2dc,#2c2c2c);
  --ink:light-dark(#1a1a1a,#f2f2f2);--mut:light-dark(#6b6b6b,#a3a3a3);--ok:#1f8a3b;--warn:#b35c00}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 Rubik,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
body{overflow-x:clip;padding-bottom:calc(96px + env(safe-area-inset-bottom))}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--r);outline-offset:2px}
.top{position:sticky;top:0;z-index:5;background:var(--y);color:#1a1a1a;padding:calc(10px + env(safe-area-inset-top)) 16px 0}
.row{display:flex;align-items:center;gap:10px}
.brand{font-weight:800;font-size:15px;letter-spacing:.2px;display:flex;align-items:center;gap:8px}
.stud{width:22px;height:22px}
.icon-btn{margin-left:auto;width:44px;height:44px;border:0;border-radius:12px;background:rgba(0,0,0,.08);display:grid;place-items:center}
.icon-btn svg{width:22px;height:22px}
.total{padding:6px 0 12px}
.total small{display:block;font-size:13px;font-weight:500;opacity:.75}
.total b{display:block;font-size:clamp(34px,10vw,48px);font-weight:800;line-height:1.05;white-space:nowrap}
.total span{font-size:14px;opacity:.8}
.tabs{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.tab{border:0;background:transparent;padding:10px 6px 12px;border-radius:12px 12px 0 0;font-weight:700;font-size:16px;color:#1a1a1a;opacity:.7}
.tab em{display:block;font-style:normal;font-weight:500;font-size:13px;white-space:nowrap}
.tab[aria-selected=true]{background:var(--bg);color:var(--ink);opacity:1}
.bar{display:flex;gap:8px;align-items:center;padding:12px 16px 4px;flex-wrap:wrap}
.bar select,.chip{height:40px;border-radius:10px;border:1px solid var(--line);background:var(--card);padding:0 12px;font-size:15px}
.chip{display:inline-flex;align-items:center;gap:6px;margin-left:auto}
.note{margin:10px 16px 0;padding:10px 12px;border-radius:12px;background:light-dark(#fff4d1,#2b2410);font-size:14px;display:flex;gap:10px;align-items:center}
.note button{margin-left:auto;border:0;background:var(--ink);color:var(--bg);border-radius:9px;padding:8px 12px;font-weight:600;flex:none}
.list{list-style:none;margin:0;padding:8px 16px}
.item{display:grid;grid-template-columns:72px minmax(0,1fr) auto;gap:12px;align-items:center;padding:10px;border-radius:16px;background:var(--card);margin-bottom:8px;border:0;width:100%;text-align:left}
.thumb{width:72px;height:72px;border-radius:12px;background:#fff;display:grid;place-items:center;overflow:hidden}
.thumb img{max-width:100%;max-height:100%;object-fit:contain}
.nm{font-weight:600;font-size:15px;line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.meta{font-size:13px;color:var(--mut);margin-top:3px;display:flex;flex-wrap:wrap;gap:4px 8px}
.sw{display:inline-block;width:11px;height:11px;border-radius:3px;border:1px solid rgba(0,0,0,.25);vertical-align:-1px;margin-right:3px}
.pr{text-align:right;white-space:nowrap}
.pr b{display:block;font-size:17px}
.pr small{display:block;font-size:12px;color:var(--mut)}
.pr .err{color:var(--warn)}
.empty{text-align:center;padding:48px 24px;color:var(--mut)}
.empty svg{width:120px;height:auto;margin-bottom:12px}
.empty p{margin:4px 0}
.dock{position:fixed;left:0;right:0;bottom:0;z-index:6;padding:12px 16px calc(12px + env(safe-area-inset-bottom));background:linear-gradient(to top,var(--bg) 70%,transparent);display:flex;gap:10px}
.scan{flex:1;height:58px;border:0;border-radius:18px;background:var(--r);color:#fff;font-weight:700;font-size:18px;display:flex;align-items:center;justify-content:center;gap:10px;box-shadow:0 6px 0 var(--r2)}
.scan:active{transform:translateY(3px);box-shadow:0 3px 0 var(--r2)}
.scan svg{width:24px;height:24px}
.gal{width:58px;height:58px;border-radius:18px;border:2px solid var(--line);background:var(--card);display:grid;place-items:center}
.gal svg{width:24px;height:24px}
.veil{position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.45);display:none;align-items:flex-end;justify-content:center}
.veil.open{display:flex}
.sheet{background:var(--bg);width:100%;max-width:640px;max-height:92vh;overflow:auto;border-radius:22px 22px 0 0;padding:8px 16px calc(18px + env(safe-area-inset-bottom));animation:up .22s ease-out}
@keyframes up{from{transform:translateY(40px);opacity:.4}}
@media (prefers-reduced-motion:reduce){.sheet{animation:none}}
.grab{width:44px;height:5px;border-radius:3px;background:var(--line);margin:4px auto 10px}
.sheet h2{font-size:22px;margin:4px 0 12px;line-height:1.15}
.sheet h3{font-size:15px;margin:16px 0 8px;color:var(--mut);font-weight:600}
.photo{display:flex;gap:12px;align-items:center;margin-bottom:6px}
.photo img{width:84px;height:84px;object-fit:cover;border-radius:12px;background:var(--card)}
.cands{display:grid;gap:8px}
.cand{display:grid;grid-template-columns:64px minmax(0,1fr) auto;gap:12px;align-items:center;padding:8px;border-radius:14px;border:2px solid var(--line);background:var(--card);text-align:left;width:100%}
.cand[aria-checked=true]{border-color:var(--r);background:light-dark(#fff1f1,#2a1415)}
.cand .thumb{width:64px;height:64px}
.score{font-size:13px;font-weight:700;white-space:nowrap}
.meter{height:5px;border-radius:3px;background:var(--line);margin-top:6px;overflow:hidden}
.meter i{display:block;height:100%;background:var(--ok)}
.seg{display:inline-grid;grid-auto-flow:column;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.seg button{border:0;background:var(--card);padding:0 16px;height:44px;font-weight:600}
.seg button[aria-pressed=true]{background:var(--ink);color:var(--bg)}
.step{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.step button{width:44px;height:44px;border:0;background:var(--card);font-size:22px;font-weight:600}
.step input{width:56px;height:44px;border:0;text-align:center;background:var(--bg);font-size:16px}
.opts{display:flex;flex-wrap:wrap;gap:14px 18px;align-items:flex-end}
.opts label{display:grid;gap:6px;font-size:13px;color:var(--mut);font-weight:600}
.field{display:grid;gap:6px;margin-bottom:12px;font-size:13px;color:var(--mut);font-weight:600}
.field input,.field select,.opts select{height:46px;border-radius:12px;border:1px solid var(--line);background:var(--card);padding:0 12px;font-size:16px;color:var(--ink);font-weight:400;width:100%}
.opts select{min-width:200px}
.acts{display:grid;gap:8px;margin-top:18px}
.btn{height:52px;border-radius:14px;border:0;font-weight:700;font-size:16px;background:var(--card);border:1px solid var(--line)}
.btn.pri{background:var(--r);color:#fff;border:0}
.btn.dark{background:var(--ink);color:var(--bg);border:0}
.btn.del{color:var(--r)}
.btn:disabled{opacity:.5}
.link{background:none;border:0;color:var(--r);font-weight:600;padding:10px 0;text-decoration:underline}
a{color:var(--r)}
.spin{width:44px;height:44px;border-radius:50%;border:5px solid var(--line);border-top-color:var(--r);animation:sp 0.9s linear infinite;margin:24px auto 10px}
@keyframes sp{to{transform:rotate(360deg)}}
.center{text-align:center;color:var(--mut)}
.help{font-size:14px;color:var(--mut);background:var(--card);border-radius:12px;padding:12px 14px;margin:6px 0 14px}
.help ol{margin:6px 0 0;padding-left:20px}.help li{margin:3px 0}
.big-price{font-size:30px;font-weight:800}
.toast{position:fixed;left:16px;right:16px;bottom:calc(92px + env(safe-area-inset-bottom));z-index:30;background:var(--ink);color:var(--bg);border-radius:14px;padding:12px 14px;display:none;align-items:center;gap:12px;max-width:600px;margin:auto;font-size:15px}
.toast.show{display:flex}
.toast button{margin-left:auto;border:0;background:var(--y);color:#1a1a1a;border-radius:9px;padding:8px 12px;font-weight:700;flex:none}
.ok{color:var(--ok)}.bad{color:var(--r)}
.reader{position:fixed;inset:0;z-index:40;background:var(--bg);display:flex;flex-direction:column;overflow:auto}
.win{flex:none;margin-top:env(safe-area-inset-top);background:var(--card);display:grid;place-items:center;text-align:center;padding:16px;color:var(--mut);font-size:14px;border-bottom:3px solid var(--y)}
.win a{font-weight:700}
.rpanel{padding:10px 16px calc(16px + env(safe-area-inset-bottom))}
.rhead{display:grid;grid-template-columns:48px minmax(0,1fr) 44px;gap:10px;align-items:center}
.rhead .thumb{width:48px;height:48px;border-radius:10px}
.rhint{font-size:14px;margin:8px 0;color:var(--mut)}
.rhint b{color:var(--ink)}
.rin{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px}
.rin input{height:52px;border-radius:14px;border:2px solid var(--r);background:var(--card);padding:0 14px;font-size:22px;font-weight:700;color:var(--ink);width:100%}
.rin .btn{padding:0 18px}
.rfoot{display:flex;gap:16px;flex-wrap:wrap;font-size:14px;margin-top:4px}
.rfoot .link{font-size:14px}
</style>
</head>
<body>
<header class="top">
  <div class="row">
    <div class="brand"><svg class="stud" viewBox="0 0 24 24"><rect x="1" y="7" width="22" height="15" rx="2.5" fill="#D01012"/><rect x="4" y="2.5" width="6" height="5.5" rx="1.2" fill="#D01012"/><rect x="14" y="2.5" width="6" height="5.5" rx="1.2" fill="#D01012"/><rect x="1" y="7" width="22" height="3" fill="#A80C0E"/></svg>BrickScan</div>
    <button class="icon-btn" id="btnSettings" aria-label="Einstellungen"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="3.2"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></button>
  </div>
  <div class="total"><small>Gesamtwert (Ø BrickLink-Verkäufe)</small><b id="total">0,00 €</b><span id="totalSub">Noch nichts gescannt</span></div>
  <div class="tabs" role="tablist">
    <button class="tab" role="tab" id="tab-fig" aria-selected="true">Minifigs<em id="sum-fig">0 · 0,00 €</em></button>
    <button class="tab" role="tab" id="tab-part" aria-selected="false">Teile<em id="sum-part">0 · 0,00 €</em></button>
  </div>
</header>

<div id="setupNote" class="note" hidden><span>Ohne BrickLink-Schlüssel liest du den Preis nach dem Scan selbst ab. Mit Schlüssel kommt er automatisch.</span><button id="btnSetup">Schlüssel</button></div>

<div class="bar">
  <select id="sort" aria-label="Sortierung">
    <option value="new">Neueste zuerst</option>
    <option value="val">Höchster Wert</option>
    <option value="name">Name A–Z</option>
  </select>
  <button class="chip" id="btnRefresh"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M21 12a9 9 0 1 1-3-6.7L21 8"/><path d="M21 3v5h-5"/></svg><span>Preise neu</span></button>
</div>

<ul class="list" id="list"></ul>

<div class="dock">
  <button class="scan" id="btnScan"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"><path d="M3 8.5A2.5 2.5 0 0 1 5.5 6h2l1.6-2.2h5.8L16.5 6h2A2.5 2.5 0 0 1 21 8.5v9a2.5 2.5 0 0 1-2.5 2.5h-13A2.5 2.5 0 0 1 3 17.5z"/><circle cx="12" cy="13" r="3.8"/></svg><span id="scanLabel">Minifig scannen</span></button>
  <button class="gal" id="btnGallery" aria-label="Foto aus Galerie"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2.5"/><circle cx="9" cy="10" r="2"/><path d="m21 16-5-5-9 9"/></svg></button>
</div>
<input type="file" id="fileCam" accept="image/*" capture="environment" hidden>
<input type="file" id="fileGal" accept="image/*" hidden>

<div class="veil" id="veil"><div class="sheet" id="sheet" role="dialog" aria-modal="true"></div></div>
<div class="reader" id="reader" hidden></div>
<div class="toast" id="toast"><span id="toastMsg"></span><button id="toastBtn" hidden>Rückgängig</button></div>

<script>
{
/* ================================================================ state */
const KEY = 'brickscan.v1';
const MOCK = /[?&]mock/.test(location.search);
const CAP = window.Capacitor;
const NATIVE = !!(CAP && CAP.nativePromise && CAP.getPlatform && CAP.getPlatform() !== 'web');
const nativeCall = (m, o) => NATIVE ? CAP.nativePromise('PriceView', m, o || {}) : Promise.resolve();
const blank = () => ({items: [], settings: {ck:'', cs:'', tk:'', ts:'', currency:'EUR', cond:'U'}, colors: null});
let S = blank();
try { const raw = localStorage.getItem(KEY); if (raw) S = Object.assign(blank(), JSON.parse(raw)); S.settings = Object.assign(blank().settings, S.settings); } catch (e) {}
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) { toast('Speichern fehlgeschlagen – Speicher voll?'); } };
let tab = 'fig', sort = 'new';
try { tab = localStorage.getItem(KEY + '.tab') || 'fig'; } catch (e) {}
const blReady = () => (MOCK && !/nokey/.test(location.search)) || ['ck','cs','tk','ts'].every(k => (S.settings[k] || '').trim());

/* ================================================================ helpers */
const $ = id => document.getElementById(id);
const esc = v => String(v ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const safeUrl = u => (typeof u === 'string' && /^(https:\/\/|data:image\/)/.test(u)) ? u : '';
const uid = () => Math.random().toString(36).slice(2, 10) + Date.now().toString(36);
const cur = () => S.settings.currency || 'EUR';
function money(v, c, small) {
  if (v == null || isNaN(v)) return '–';
  const d = small && v < 1 ? 3 : 2;
  try { return new Intl.NumberFormat('de-DE', {style:'currency', currency:c || cur(), minimumFractionDigits:2, maximumFractionDigits:d}).format(v); }
  catch (e) { return v.toFixed(2) + ' ' + (c || ''); }
}
const sleep = ms => new Promise(r => setTimeout(r, ms));
let toastT, undoFn = null;
function toast(msg, undo) {
  $('toastMsg').textContent = msg; undoFn = undo || null; $('toastBtn').hidden = !undo;
  $('toast').classList.add('show'); clearTimeout(toastT); toastT = setTimeout(() => $('toast').classList.remove('show'), undo ? 6000 : 3500);
}
$('toastBtn').onclick = () => { if (undoFn) undoFn(); undoFn = null; $('toast').classList.remove('show'); };

/* ================================================================ Brickognize */
function blIdFrom(it) {
  for (const s of it.external_sites || []) {
    const u = String(s.url || '');
    if (/bricklink/i.test((s.name || '') + u)) {
      try { const q = new URL(u).searchParams; for (const k of ['P','M','S','G']) if (q.get(k)) return q.get(k); } catch (e) {}
    }
  }
  return it.id;
}
async function recognize(kind, blob) {
  if (MOCK) return mockRecognize(kind);
  const fd = new FormData();
  fd.append('query_image', blob, 'scan.jpg');
  let res;
  try { res = await fetch(`https://api.brickognize.com/predict/${kind}/`, {method:'POST', body:fd, headers:{Accept:'application/json'}}); }
  catch (e) { throw new Error('Keine Verbindung zu Brickognize. Internet an?'); }
  if (!res.ok) throw new Error('Brickognize antwortet mit Fehler ' + res.status);
  const j = await res.json();
  return (j.items || []).slice(0, 6).map(it => ({no: blIdFrom(it), name: it.name || it.id, img: it.img_url, score: it.score, category: it.category}));
}

/* ================================================================ BrickLink (OAuth 1.0 HMAC-SHA1) */
const BL = 'https://api.bricklink.com/api/store/v1';
const enc = s => encodeURIComponent(String(s)).replace(/[!'()*]/g, c => '%' + c.charCodeAt(0).toString(16).toUpperCase());
async function hmacSha1(key, msg) {
  const te = new TextEncoder();
  const k = await crypto.subtle.importKey('raw', te.encode(key), {name:'HMAC', hash:'SHA-1'}, false, ['sign']);
  const sig = new Uint8Array(await crypto.subtle.sign('HMAC', k, te.encode(msg)));
  let s = ''; sig.forEach(b => s += String.fromCharCode(b)); return btoa(s);
}
async function blGet(path, params = {}) {
  const st = S.settings, url = BL + path;
  const p = Object.fromEntries(Object.entries(params).filter(([, v]) => v !== '' && v != null));
  const oauth = {oauth_consumer_key: st.ck.trim(), oauth_token: st.tk.trim(), oauth_signature_method: 'HMAC-SHA1',
    oauth_timestamp: String(Math.floor(Date.now() / 1000)), oauth_nonce: uid() + uid(), oauth_version: '1.0'};
  const pairs = Object.entries({...p, ...oauth}).map(([k, v]) => [enc(k), enc(v)]).sort((a, b) => a[0] < b[0] ? -1 : a[0] > b[0] ? 1 : a[1] < b[1] ? -1 : a[1] > b[1] ? 1 : 0);
  const base = ['GET', enc(url), enc(pairs.map(x => x.join('=')).join('&'))].join('&');
  oauth.oauth_signature = await hmacSha1(enc(st.cs.trim()) + '&' + enc(st.ts.trim()), base);
  const auth = 'OAuth realm="", ' + Object.entries(oauth).map(([k, v]) => `${k}="${enc(v)}"`).join(', ');
  const qs = new URLSearchParams(p).toString();
  let res;
  try { res = await fetch(url + (qs ? '?' + qs : ''), {headers: {Authorization: auth, Accept: 'application/json'}}); }
  catch (e) { throw new Error('Keine Verbindung zu BrickLink'); }
  let j; try { j = await res.json(); } catch (e) { throw new Error('BrickLink: ungültige Antwort (' + res.status + ')'); }
  const m = j.meta || {};
  if (m.code !== 200) {
    if (m.code === 401) throw new Error('BrickLink lehnt die Schlüssel ab (' + (m.description || m.message || '401') + ')');
    if (m.code === 404) throw new Error('Bei BrickLink nicht gefunden');
    throw new Error('BrickLink ' + (m.code || res.status) + ': ' + (m.message || ''));
  }
  return j.data;
}
async function allColors() {
  if (S.colors) return S.colors;
  const data = MOCK ? [{color_id:11,color_name:'Black',color_code:'212121'},{color_id:5,color_name:'Red',color_code:'B30006'},{color_id:1,color_name:'White',color_code:'FFFFFF'},{color_id:86,color_name:'Light Bluish Gray',color_code:'AFB5C7'},{color_id:3,color_name:'Yellow',color_code:'F7D117'}] : await blGet('/colors');
  S.colors = {}; for (const c of data) S.colors[c.color_id] = {id: c.color_id, name: c.color_name, rgb: c.color_code || ''};
  save(); return S.colors;
}
async function knownColors(no) {
  const cols = await allColors();
  const ids = MOCK ? Object.keys(cols).map(Number) : (await blGet(`/items/PART/${encodeURIComponent(no)}/colors`)).map(k => k.color_id);
  return ids.map(i => cols[i]).filter(Boolean).sort((a, b) => a.name.localeCompare(b.name));
}
async function priceFor(it) {
  if (MOCK) { await sleep(250); return {price: +(it.kind === 'part' ? Math.random() * 0.8 + 0.03 : Math.random() * 30 + 2).toFixed(3), currency: cur(), src: 'sold', sold_qty: Math.floor(Math.random() * 300) + 2}; }
  const type = it.kind === 'fig' ? 'MINIFIG' : 'PART';
  const path = `/items/${type}/${encodeURIComponent(it.no)}/price`;
  const params = {guide_type: 'sold', new_or_used: it.cond, currency_code: cur()};
  if (it.kind === 'part' && it.color_id) params.color_id = it.color_id;
  let d = await blGet(path, params);
  if (d && +d.avg_price > 0) return {price: +d.avg_price, currency: d.currency_code, src: 'sold', sold_qty: d.total_quantity};

  d = await blGet(path, params);
  if (d && +d.avg_price > 0) return {price: +d.avg_price, currency: d.currency_code, src: 'stock', sold_qty: 0};
  return {price: null, currency: cur(), src: 'none', sold_qty: 0};
}

function mockRecognize(kind) {
  const svg = (t, c) => 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80"><rect x="10" y="26" width="60" height="40" rx="5" fill="${c}"/><rect x="18" y="16" width="14" height="12" rx="3" fill="${c}"/><rect x="48" y="16" width="14" height="12" rx="3" fill="${c}"/><text x="40" y="52" font-size="12" text-anchor="middle" fill="#fff" font-family="sans-serif">${t}</text></svg>`);
  const c = kind === 'figs'
    ? [['sw0001a','Battle Droid Tan with Back Plate',.93],['sw0001b','Battle Droid Tan without Back Plate',.71],['sw0299','Battle Droid Commander with Yellow Torso',.38]]
    : [['3001','Brick 2 x 4',.96],['3003','Brick 2 x 2',.52],['3002','Brick 2 x 3',.41],['3010','Brick 1 x 4',.22]];
  return sleep(700).then(() => c.map(([no, name, score], i) => ({no, name, score, img: svg(no, ['#D01012','#0055BF','#237841','#555'][i])})));
}

/* ================================================================ image prep */
async function prep(file) {
  const url = URL.createObjectURL(file);
  try {
    const img = await new Promise((ok, no) => { const i = new Image(); i.onload = () => ok(i); i.onerror = no; i.src = url; });
    const draw = (max, q) => { const s = Math.min(1, max / Math.max(img.width, img.height)); const c = document.createElement('canvas'); c.width = Math.round(img.width * s); c.height = Math.round(img.height * s); c.getContext('2d').drawImage(img, 0, 0, c.width, c.height); return c; };
    const blob = await new Promise(r => draw(1280, .85).toBlob(r, 'image/jpeg', .85));
    return {blob: blob || file, thumb: draw(180, .7).toDataURL('image/jpeg', .7)};
  } catch (e) { return {blob: file, thumb: ''}; }
  finally { URL.revokeObjectURL(url); }
}

  const url = blLink(it), used = it.cond !== 'N';
  const winH = Math.round(Math.max(240, Math.min(window.innerHeight * 0.42, 520)));
  reader.innerHTML = `<div class="win" id="win" style="height:${winH}px">${NATIVE ? 'BrickLink wird geladen …'
      : `<div>Hier erscheint in der App die BrickLink-Preisseite.<br><a href="${esc(url)}" target="_blank" rel="noopener">BrickLink-Preisseite öffnen</a></div>`}</div>
    <div class="rpanel">
      <div class="rhead">${thumbHtml(it)}<div><div class="nm">${esc(it.name)}</div><div class="meta"><span>${esc(it.no)}</span>${it.color_name ? `<span>${esc(it.color_name)}</span>` : ''}<span>${used ? 'Gebraucht' : 'Neu'}</span>${it.qty > 1 ? `<span>${it.qty}×</span>` : ''}</div></div>
        <button class="icon-btn" id="rclose" aria-label="Schließen" style="margin:0"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg></button></div>
      <p class="rhint">Bei <b>Past 6 Months Sales</b> in der Spalte <b>${used ? 'Used' : 'New'}</b> den Wert <b>Avg Price</b> ablesen${it.kind === 'part' && !it.color_id ? ' (oben zuerst die <b>Farbe</b> wählen)' : ''}. Preis pro Stück:</p>
      <div class="rin"><input id="rprice" inputmode="decimal" placeholder="0,00" value="${it.price != null ? esc(String(+it.price.toFixed(3)).replace('.', ',')) : ''}" aria-label="Preis pro Stück in ${esc(cur())}"><button class="btn pri" id="rsave">Übernehmen</button></div>
      <div class="rfoot">${NATIVE ? '<button class="link" id="rreload">Seite neu laden</button>' : ''}<a href="${esc(url)}" target="_blank" rel="noopener" style="padding:10px 0">Im Browser öffnen</a></div>
      <p class="rhint" style="font-size:13px">Zeigt BrickLink US $ statt ${esc(cur())}? Melde dich im Fenster einmal bei BrickLink an, dann gilt deine Währung.</p>
    </div>`;
  reader.hidden = false;
  if (NATIVE) requestAnimationFrame(() => {
    const r = $('win').getBoundingClientRect();
    nativeCall('open', {url, top: r.top, height: r.height}).catch(e => toast(String(e && e.message || e)));
  });
}
function closeReader(fromNative) {
  if (reader.hidden) return;
  reader.hidden = true; reader.innerHTML = ''; readerItem = null;
  if (!fromNative) nativeCall('close').catch(() => {});
}
window.addEventListener('priceviewclosed', () => closeReader(true));
reader.addEventListener('click', e => {
  const t = e.target.closest('button'); if (!t) return;
  if (t.id === 'rclose') return closeReader();
  if (t.id === 'rreload') return nativeCall('reload').catch(() => {});
  if (t.id === 'rsave') {
    const it = readerItem, v = parsePrice($('rprice').value);
    if (v == null) { $('rprice').focus(); return toast('Bitte den Preis eintippen, z. B. 4,50'); }
    Object.assign(it, {price: v, src: 'manual', err: null, currency: cur(), at: Date.now()});
    save(); closeReader(); render();
    toast(`${it.name}: ${money(v * it.qty, it.currency, true)}`);
  }
});
reader.addEventListener('keydown', e => { if (e.key === 'Enter' && e.target.id === 'rprice') $('rsave').click(); });

/* ---------- refresh all */
let refreshing = false;
async function refreshAll() {
  if (refreshing) return;
  if (!blReady()) { openSettings(); return; }
  const todo = S.items.filter(i => i.src !== 'manual'); if (!todo.length) { toast('Nichts zu aktualisieren'); return; }
  refreshing = true; const lab = $('btnRefresh').querySelector('span');
  let n = 0, bad = 0;
  for (const it of todo) { lab.textContent = `${++n}/${todo.length}`; it.src = 'none'; await applyPrice(it); if (it.err) bad++; render(); await sleep(120); }
  save(); refreshing = false; lab.textContent = 'Preise neu'; render();
  toast(bad ? `${todo.length - bad} aktualisiert, ${bad} mit Fehler` : 'Alle Preise aktualisiert');
}

/* ================================================================ events */
for (const k of ['fig','part']) $('tab-' + k).onclick = () => { tab = k; try { localStorage.setItem(KEY + '.tab', k); } catch (e) {} render(); window.scrollTo({top: 0}); };
$('sort').onchange = e => { sort = e.target.value; render(); };
$('btnRefresh').onclick = refreshAll;
$('btnSettings').onclick = openSettings;
$('btnSetup').onclick = openSettings;
$('list').addEventListener('click', e => { const b = e.target.closest('.item'); if (b) openItem(b.dataset.uid); });

sheet.addEventListener('click', e => {
  const t = e.target.closest('button'); if (!t) return;
  const d = t.dataset;
  if (d.act) {
    const s = scan;
    if (d.act === 'close') return closeSheet();
    if (d.act === 'rescan') { const k = tab; closeSheet(); tab = k; return pickFile(false); }
    if (d.act === 'manual') { if (!scan) scan = {kind: tab, cands: [], sel: 0, cond: S.settings.cond || 'U', qty: 1, photo: ''}; scan.manual = true; return drawScan(); }
    if (d.act === 'back') { s.manual = false; drawScan(); if (s.kind === 'part' && s.colors == null) loadColors(); return; }
    if (d.act === 'add') {
      const c = s.cands[s.sel]; const col = s.color && S.colors && blReady() ? S.colors[s.color] : null;
      return addItem({kind: s.kind, no: c.no, name: c.name, img2: c.img, color_id: col ? col.id : null, color_name: col ? col.name : (s.kind === 'part' && (s.colorTxt || '').trim() ? s.colorTxt.trim() : null), color_rgb: col ? col.rgb : null});
    }
    if (d.act === 'addManual') {
      const no = $('mNo').value.trim(); if (!no) { $('mNo').focus(); return toast('Bitte BrickLink-Nummer eingeben'); }
      const cid = s.kind === 'part' ? parseInt($('mColor').value, 10) || null : null; const col = cid && S.colors ? S.colors[cid] : null;
      return addItem({kind: s.kind, no, name: $('mName').value.trim() || no, img2: '', color_id: cid, color_name: col ? col.name : (cid ? 'Farbe ' + cid : null), color_rgb: col ? col.rgb : null});
    }
  }
  if (d.sel != null && scan) { const i = +d.sel; if (i !== scan.sel) { scan.sel = i; drawScan(); if (scan.kind === 'part') loadColors(); } return; }
  if (d.cond && scan) { scan.cond = d.cond; return drawScan(); }
  if (d.q && scan) { scan.qty = Math.max(1, (parseInt($('qty').value, 10) || 1) + +d.q); $('qty').value = scan.qty; return; }
  if (d.iq || d.icond) {
    const it = S.items.find(i => i.uid === sheet.dataset.uid); if (!it) return;
    if (d.iq) { it.qty = Math.max(1, (parseInt($('iqty').value, 10) || 1) + +d.iq); save(); render(); return openItem(it.uid); }
    if (d.icond !== it.cond) { it.cond = d.icond; t.parentNode.querySelectorAll('button').forEach(b => b.setAttribute('aria-pressed', String(b === t))); (async () => { await applyPrice(it); save(); render(); openItem(it.uid); })(); }
    return;
  }
  if (d.iact) return itemAction(d.iact, t);
  if (d.scond) { t.parentNode.querySelectorAll('button').forEach(b => b.setAttribute('aria-pressed', String(b === t))); return; }
  if (d.sact) return settingsAction(d.sact, t);
});
sheet.addEventListener('input', e => { if (e.target.id === 'colorTxt' && scan) scan.colorTxt = e.target.value; });
sheet.addEventListener('change', e => {
  if (e.target.id === 'color' && scan) scan.color = e.target.value;
  if (e.target.id === 'colorTxt' && scan) scan.colorTxt = e.target.value;
  if (e.target.id === 'qty' && scan) scan.qty = Math.max(1, parseInt(e.target.value, 10) || 1);
  if (e.target.id === 'iqty') { const it = S.items.find(i => i.uid === sheet.dataset.uid); if (it) { it.qty = Math.max(1, parseInt(e.target.value, 10) || 1); save(); render(); openItem(it.uid); } }
});

render();
}
</script>
</body>
</html>
